# Local development stack.
#
# nginx is bound to 127.0.0.1 on ports 9080/9443 so it never collides with other
# local web servers (Local by Flywheel, Rails on 3000, etc.).
#
# One-time setup:
#   npm run local -- setup   — installs the mkcert CA, generates a cert, adds /etc/hosts
#
# Access the app at:  https://biz.loc:9443
#          the API at: https://api.biz.loc:9443

services:
  nginx:
    image: nginx:alpine
    container_name: biz-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '127.0.0.1:9080:80'
      - '127.0.0.1:9443:443'
    volumes:
      - ./docker/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - biz.loc
          - api.biz.loc

  api:
    extends:
      file: docker-compose.yml
      service: api-build-base
    build:
      target: api-local
    container_name: biz-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      BUILD_ENV: local
      NODE_ENV: development
      PORT: 3000
      WAIT_FOR: 'db:5432 redis:6379'
      DATABASE_URL: postgres://biz:biz@db:5432/biz_db_development
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_APP_URL: https://biz.loc:9443
      PUBLIC_API_URL: https://api.biz.loc:9443
      CORS_ALLOWED_ORIGINS: https://biz.loc:9443
    volumes:
      # Bind-mounted for live editing — `node --watch` reloads without a rebuild.
      - ./api:/app/api
    ports:
      - '127.0.0.1:9001:3000'

  web:
    extends:
      file: docker-compose.yml
      service: web-build-base
    build:
      target: web-local
    container_name: biz-web
    restart: unless-stopped
    init: true
    depends_on:
      - api
    environment:
      BUILD_ENV: local
      NODE_ENV: development
      PORT: 3000
      # Browser-side calls go through nginx; server-side calls stay on the network.
      NEXT_PUBLIC_API_URL: https://api.biz.loc:9443
      API_INTERNAL_URL: http://api:3000
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./web:/app/web
      - /app/web/.next
    ports:
      - '127.0.0.1:9002:3000'

  db:
    image: postgres:${POSTGRES_VERSION}-alpine
    container_name: biz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: biz_db_development
      POSTGRES_USER: biz
      POSTGRES_PASSWORD: biz
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=100']
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:9432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U biz -d biz_db_development']
      interval: 10s
      timeout: 5s
      retries: 10

  adminneo:
    image: adminneoorg/adminneo:latest
    container_name: biz-adminneo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:9082:8080'
    environment:
      NEO_DEFAULT_DRIVER: pgsql
      NEO_DEFAULT_SERVER: db:5432
      NEO_DEFAULT_DATABASE: biz_db_development

  # Valkey matches the Redis-compatible engine used by managed cloud caches.
  redis:
    image: valkey/valkey:${VALKEY_VERSION}-alpine
    container_name: biz-valkey
    restart: unless-stopped
    command: ['valkey-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']

  # Opt-in: start with `docker compose --profile tools up -d redisinsight`.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: biz-redisinsight
    profiles: ['tools']
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - '127.0.0.1:5541:5540'
    volumes:
      - redisinsight_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: biz-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:11026:1025'
      - '127.0.0.1:18026:8025'

volumes:
  db_data:
  redisinsight_data:
