# Local development stack.
#
# nginx is bound to 127.0.0.1 on ports 9080/9443 so it never collides with other
# local web servers (Local by Flywheel, Rails on 3000, etc.).
#
# One-time setup:
#   npm run local -- setup   — installs the mkcert CA, generates a cert, adds /etc/hosts
#
# Access the app at:  https://biz.loc:9443
#          the API at: https://api.biz.loc:9443

services:
  nginx:
    image: nginx:alpine
    container_name: biz-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '127.0.0.1:9080:80'
      - '127.0.0.1:9443:443'
    volumes:
      - ./docker/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - biz.loc
          - api.biz.loc

  api:
    extends:
      file: docker-compose.yml
      service: api-build-base
    build:
      target: api-local
    container_name: biz-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      BUILD_ENV: local
      NODE_ENV: development
      PORT: 3000
      WAIT_FOR: 'db:3306'
      DATABASE_URL: mysql://biz:biz@db:3306/biz_db_development
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-local-development-api-token}
      OTP_SECRET_ENCRYPTION_KEY: ${OTP_SECRET_ENCRYPTION_KEY:-local-only-otp-encryption-key-change-before-deploy}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: 'Sefer Design Co. <info@seferdesign.com>'
      PUBLIC_APP_URL: https://biz.loc:9443
      PUBLIC_API_URL: https://api.biz.loc:9443
      CORS_ALLOWED_ORIGINS: https://biz.loc:9443,http://localhost:3000,http://127.0.0.1:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_NOTIFICATION_EMAIL: ${PAYMENT_NOTIFICATION_EMAIL:-info@seferdesign.com}
    volumes:
      # Bind-mounted for live editing — `node --watch` reloads without a rebuild.
      - ./api:/app/api
    ports:
      - '127.0.0.1:9001:3000'

  web:
    extends:
      file: docker-compose.yml
      service: web-build-base
    build:
      target: web-local
    container_name: biz-web
    restart: unless-stopped
    init: true
    depends_on:
      - api
    environment:
      BUILD_ENV: local
      NODE_ENV: development
      PORT: 3000
      # Browser-side calls go through nginx; server-side calls stay on the network.
      NEXT_PUBLIC_API_URL: https://api.biz.loc:9443
      API_INTERNAL_URL: http://api:3000
      PUBLIC_APP_URL: https://biz.loc:9443
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./web:/app/web
      - /app/web/.next
    ports:
      - '127.0.0.1:9002:3000'

  db:
    image: mysql:${MYSQL_VERSION}
    container_name: biz-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: biz_db_development
      MYSQL_USER: biz
      MYSQL_PASSWORD: biz
      MYSQL_ROOT_PASSWORD: local-root-only
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:9432:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -ubiz -pbiz --silent']
      interval: 10s
      timeout: 5s
      retries: 10

  adminneo:
    image: adminneoorg/adminneo:latest
    container_name: biz-adminneo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:9082:8080'
    environment:
      NEO_DEFAULT_DRIVER: mysql
      NEO_DEFAULT_SERVER: db:3306
      NEO_DEFAULT_DATABASE: biz_db_development

  mailpit:
    image: axllent/mailpit:latest
    container_name: biz-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:11026:1025'
      - '127.0.0.1:18026:8025'

volumes:
  mysql_data:
