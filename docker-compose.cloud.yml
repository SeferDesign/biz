# Cloud/production image definitions. These build the same Dockerfile targets
# that run locally, so the only difference between environments is configuration.
x-biz-defaults: &biz-defaults
  build:
    args:
      BUILD_ENV: ${BUILD_ENV:-prod}
  restart: always

services:
  biz-api:
    <<: *biz-defaults
    extends:
      file: docker-compose.yml
      service: api-build-base
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
      SMTP_HOST: email-smtp.${AWS_SES_REGION:-us-east-1}.amazonaws.com
      SMTP_PORT: 587
      SMTP_USER: ${AWS_SES_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${AWS_SES_SMTP_PASSWORD:-}
      SMTP_SECURE: 'false'
      SMTP_FROM: '${SMTP_FROM:-Sefer Design Co. <info@seferdesign.com>}'
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

  biz-web:
    <<: *biz-defaults
    extends:
      file: docker-compose.yml
      service: web-build-base
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-}
