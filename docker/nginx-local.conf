map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name biz.loc;
    # $host omits the port; hardcode it so the redirect lands on this stack.
    return 301 https://biz.loc:9443$request_uri;
}

server {
    listen 80;
    server_name api.biz.loc;
    return 301 https://api.biz.loc:9443$request_uri;
}

server {
    listen 443 ssl;
    listen 9443 ssl;
    server_name api.biz.loc;

    ssl_certificate     /etc/nginx/certs/biz.loc.pem;
    ssl_certificate_key /etc/nginx/certs/biz.loc-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://api:3000;
    }
}

server {
    listen 443 ssl;
    listen 9443 ssl;
    server_name biz.loc;

    ssl_certificate     /etc/nginx/certs/biz.loc.pem;
    ssl_certificate_key /etc/nginx/certs/biz.loc-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Next.js dev server websocket for hot reload.
    location /_next/webpack-hmr {
        proxy_pass http://web:3000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
