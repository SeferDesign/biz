openapi: 3.0.3
info:
  title: SeferBiz API
  version: 1.0.0
  description: Express-based API rebuilt from the existing route map and resource list.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /v1/invoices:
    get:
      summary: List invoices
      responses:
        '200':
          description: Invoice list
    post:
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceInput'
      responses:
        '201':
          description: Invoice created
  /v1/invoices/{id}:
    get:
      summary: Get invoice by id
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Invoice record
  /v1/invoices/{id}/email:
    get:
      summary: Send invoice email
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Email queued
  /v1/invoices/{invoice_id}/lines:
    get:
      summary: List invoice lines
      parameters:
        - $ref: '#/components/parameters/InvoiceIdParam'
      responses:
        '200':
          description: Invoice lines
    post:
      summary: Create invoice line
      parameters:
        - $ref: '#/components/parameters/InvoiceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceLineInput'
      responses:
        '201':
          description: Invoice line created
  /v1/invoices/{invoice_id}/lines/{id}:
    get:
      summary: Get invoice line by id
      parameters:
        - $ref: '#/components/parameters/InvoiceIdParam'
        - $ref: '#/components/parameters/LineIdParam'
      responses:
        '200':
          description: Invoice line
  /v1/clients:
    get:
      summary: List clients
      responses:
        '200':
          description: Client list
  /v1/clients/{id}:
    get:
      summary: Get client by id
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Client record
  /years:
    get:
      summary: List financial years
      responses:
        '200':
          description: Financial years ordered newest first
  /years/new:
    get:
      summary: Get defaults for a new financial year
      responses:
        '200':
          description: New year form values
  /years/{id}:
    get:
      summary: Get financial year totals
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Financial year and totals
        '404':
          description: Financial year not found
  /years/{id}/edit:
    get:
      summary: Get a financial year for editing
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Financial year record
        '404':
          description: Financial year not found
  /years/{id}/income:
    get:
      summary: Get paid invoice income for a financial year
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Income report
        '404':
          description: Financial year not found
  /years/{id}/expenses:
    get:
      summary: Get expenses for a financial year
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Expense report
        '404':
          description: Financial year not found
  /invoices/{id}/email:
    get:
      summary: Queue an invoice email
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Email queued
        '404':
          description: Invoice not found
  /invoices/{id}/stripe:
    get:
      summary: Confirm a Stripe invoice payment
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Payment confirmed
        '400':
          description: Invalid Stripe session
        '404':
          description: Invoice not found
  /expenses:
    get:
      summary: List expenses
      responses:
        '200':
          description: Expense list
  /vendors:
    get:
      summary: List vendors
      responses:
        '200':
          description: Vendor list
  /charts_controller/trailing_x_months/{number_of_months}:
    get:
      summary: Get trailing monthly invoice, expense, and goal data
      parameters:
        - name: number_of_months
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 120
      responses:
        '200':
          description: Trailing monthly chart series
        '400':
          description: Invalid month count
  /charts_controller/year_invoice_month/{id}:
    get:
      summary: Get monthly paid invoice totals
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Monthly invoice chart series
        '404':
          description: Financial year not found
  /charts_controller/year_invoice_month_with_goal/{id}:
    get:
      summary: Get monthly invoice totals and goals
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Monthly invoice and goal chart series
        '404':
          description: Financial year not found
  /charts_controller/year_all_data/{id}:
    get:
      summary: Get invoice, expense, and goal data for a year
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Monthly chart series
        '404':
          description: Financial year not found
  /charts_controller/year_expense_category/{id}:
    get:
      summary: Get expense totals by category
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Expense category totals
        '404':
          description: Financial year not found
  /charts_controller/year_expense_month/{id}:
    get:
      summary: Get monthly expense totals
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Monthly expense chart series
        '404':
          description: Financial year not found
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    InvoiceIdParam:
      name: invoice_id
      in: path
      required: true
      schema:
        type: integer
    LineIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    InvoiceInput:
      type: object
      required:
        - client_id
      properties:
        client_id:
          type: integer
        status:
          type: string
        total:
          type: number
        currency:
          type: string
    InvoiceLineInput:
      type: object
      required:
        - description
      properties:
        description:
          type: string
        amount:
          type: number
    Invoice:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        status:
          type: string
        total:
          type: number
        currency:
          type: string
    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
